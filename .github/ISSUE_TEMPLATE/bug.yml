name: 问题反馈
description: 描述可以复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请使用合成样例。不要上传数据库、private/config.json、API 密钥、日历订阅链接或个人资料。安全漏洞请按 SECURITY.md 私密报告。"
  - type: input
    id: version
    attributes:
      label: 版本与运行环境
      description: "例如 v0.15.0、Linux Docker、浏览器版本"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: "从哪一步开始，做了什么？"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的日志或合成样例
      description: "删除个人内容、主机地址、Cookie 和凭据后再提供。"
