name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JINDU_TEST_PYTHON: python
      JINDU_PYTHON: python
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:workbooks
      - run: npm run test:upgrade
      - run: python tests/doc-v12.py
      - run: npm run test:smoke

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the public Dockerfile
        run: docker build --tag jindu:ci .
      - name: Check the runtime with synthetic data and no external network
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,size=256m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          jindu:ci node --experimental-strip-types deploy/portable/smoke.mjs
      - name: Check actual legacy DOC conversion with a generated document
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,size=256m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          --mount type=bind,source="${{ github.workspace }}/tests/linux-doc-runtime.py",target=/app/check-doc.py,readonly
          jindu:ci /opt/python/bin/python /app/check-doc.py
      - name: Check first installation, worker health and reinitialization guard
        env:
          CI: 'true'
          JINDU_IMAGE: jindu:ci
        run: python3 tests/docker-install.py
