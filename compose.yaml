name: jindu
x-runtime: &runtime
  image: ${JINDU_IMAGE:-jindu:local}
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - ./data:/var/lib/jindu
    - ./private:/run/jindu:ro
  tmpfs:
    - /tmp:size=256m,mode=1777
  environment:
    JINDU_CONFIG: /run/jindu/config.json
    TZ: Asia/Shanghai
  stop_grace_period: 6m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "2"

services:
  web:
    <<: *runtime
    command: [node, --experimental-strip-types, backend/app.ts]
    ports: ["127.0.0.1:${JINDU_PORT:-8788}:8788"]
    healthcheck:
      test: [CMD, node, deploy/portable/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  worker:
    <<: *runtime
    command: [node, --experimental-strip-types, backend/worker.ts]
    scale: 1
    healthcheck:
      test: [CMD, node, --experimental-strip-types, deploy/portable/worker-healthcheck.mjs]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
  init:
    image: ${JINDU_IMAGE:-jindu:local}
    profiles: [setup]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      JINDU_ORIGIN: ${JINDU_ORIGIN:-http://localhost:8788}
      JINDU_ADMIN: ${JINDU_ADMIN:-admin}
    volumes:
      - ./data:/var/lib/jindu
      - ./private:/run/jindu
    command: [node, deploy/portable/initialize.mjs]
